<!--
  Gran Turismo's tyre display: a drivetrain diagram in the middle — two
  axles, a small car, the front's turning arrows — between two brackets,
  and a tall tyre at each corner, red from the top as far as it is worn,
  the rest coloured by its temperature (blue cold, white right, red hot:
  the temp-* tokens). Beside each tyre its temperature, pressure and wear,
  which GT does not show; each can be switched off in the overlay's options.
-->
<div class="panel tyres gt-tyres" data-class="is-empty: empty">
  <div class="gt-ty">
    <span class="gt-brk left"></span>
    <div class="gt-ty-side left"><div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ lf.tempC }}</span><span data-part="pressure">{{ lf.psi }} psi</span><span data-part="wear">{{ lf.wearPct }}%</span></div><div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ lr.tempC }}</span><span data-part="pressure">{{ lr.psi }} psi</span><span data-part="wear">{{ lr.wearPct }}%</span></div></div>
    <div class="gt-ty-unit">
      <i class="gt-pill fl" style="background:{{ lf.colour }}"><b style="height:{{ lf.wornPct }}%"></b></i><i class="gt-pill fr" style="background:{{ rf.colour }}"><b style="height:{{ rf.wornPct }}%"></b></i><i class="gt-pill rl" style="background:{{ lr.colour }}"><b style="height:{{ lr.wornPct }}%"></b></i><i class="gt-pill rr" style="background:{{ rr.colour }}"><b style="height:{{ rr.wornPct }}%"></b></i>
      <svg class="gt-chassis" viewBox="0 0 80 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="gt-ax" d="M0 23h80M0 97h80M40 23v74"></path>
        <path class="gt-turn" d="M24 12 Q40 5 56 12"></path>
        <path class="gt-turn-head" d="M21 14l3-5 3 4zM59 14l-3-5-3 4z"></path>
        <rect class="gt-body" x="30" y="44" width="20" height="32" rx="7"></rect>
      </svg>
    </div>
    <div class="gt-ty-side right"><div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ rf.tempC }}</span><span data-part="pressure">{{ rf.psi }} psi</span><span data-part="wear">{{ rf.wearPct }}%</span></div><div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ rr.tempC }}</span><span data-part="pressure">{{ rr.psi }} psi</span><span data-part="wear">{{ rr.wearPct }}%</span></div></div>
    <span class="gt-brk right"></span>
  </div>
  <div class="gt-caption gt-note" data-part="note">Last pit read</div>
  <div class="empty">{{ empty }}</div>
</div>
