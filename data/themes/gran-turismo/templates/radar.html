<!--
  Gran Turismo's radar: thin rings over the scene, the road as a lighter
  strip through the middle with a crosshair through you, the other cars as
  blue arrowheads and yours in red, and its caption under it.
-->
<div class="panel radar gt-radar">
  <x-radar cars="chevron" disc="none" road="strip"></x-radar>
  <div class="gt-course-cap" data-part="label"><span>◀</span>Radar<span>▶</span></div>
</div>
