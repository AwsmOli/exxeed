<!-- Gran Turismo's local course map: the road around you in white outline, fading out at the edges, with its caption under it. -->
<div class="panel minimap gt-minimap" data-class="is-empty: empty">
  <x-minimap road="outline" cars="chevron" disc="none"></x-minimap>
  <div class="gt-course-cap" data-part="label"><span>◀</span>Course Map<span>▶</span></div>
  <div class="empty">no map for this track</div>
</div>
