<!-- The delta bar with its fill glowing in the trend colour, and the number glowing with it. -->
<div class="panel delta sw-delta" data-class="is-empty: empty">
  <div class="sw-dglow" style="color:{{ colour }}"><div class="delta-track"><i style="left:{{ fillLeft }}%;width:{{ fillWidth }}%;border-radius:{{ fillRadius }};background:{{ colour }}"></i></div></div>
  <div class="delta-readout n" data-part="number" data-class="good: good; bad: bad">{{ deltaS | signed:2 }}</div>
  <div class="delta-dial">
    <x-delta-dial glow="14"></x-delta-dial>
    <div class="delta-dial-mid" data-part="number"><span class="cap">Delta</span><b class="n" data-class="good: good; bad: bad">{{ deltaS | signed:3 }}</b></div>
  </div>
  <div class="empty">no delta yet — waiting for a timed lap against a reference</div>
</div>
