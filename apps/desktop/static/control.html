<!doctype html>
<!--
  The control window.

  Everything else the app puts on screen is an overlay: transparent,
  click-through when asked, and visible only while a session runs. That leaves
  nowhere to press a button, which is why this window exists. It is the only
  ordinary window in the app.

  A VS Code-shaped activity bar on the left — icons, no labels, the active one
  picked out by an accent edge — start/stop always visible above the content,
  and one line at the bottom saying what is happening now. Overlays comes
  first — arranging where the callouts, delta bar and map sit is what someone
  opens this window to do before they ever touch Track Coach.

  That bottom line earns its place: "waiting for the sim", "no notes for this
  track" and "running, not recording because this track is already mapped" are
  three completely different situations that are indistinguishable from silence.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Exxeed</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: grid;
        grid-template-columns: 48px 1fr;
        user-select: none;
      }

      /* Activity bar — VS Code's shape: a narrow strip of icons with no
         labels, the active one picked out by a left edge and a brighter icon
         rather than a filled background. More land here later; Overlays and
         Track Coach are the first two. */
      .sidebar {
        background: #0b0d11;
        border-right: 1px solid #21262d;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 8px;
        gap: 2px;
      }
      .section-btn {
        appearance: none;
        border: 0;
        border-left: 2px solid transparent;
        background: transparent;
        color: #6e7681;
        width: 48px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .section-btn svg { width: 22px; height: 22px; }
      .section-btn:hover { color: #c9d1d9; }
      .section-btn.active { color: #e6edf3; border-left-color: #58a6ff; }

      /* Everything else. */
      .shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        min-height: 0;
      }

      nav.top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid #21262d;
      }
      button.power {
        appearance: none;
        border: 0;
        border-radius: 7px;
        padding: 8px 22px;
        font: 600 13px/1.2 inherit;
        color: #05130a;
        background: #3fb950;
        cursor: pointer;
      }
      button.power:hover { filter: brightness(1.08); }
      button.power.on { background: #f85149; color: #1a0505; }
      nav.top .spacer { flex: 1; }
      nav.top .pinned { color: #6e7681; font-size: 11.5px; }

      main { overflow-y: auto; padding: 12px 14px; min-height: 0; }
      .view { display: none; }
      .view.active { display: block; }

      .section-head {
        display: flex; justify-content: space-between; align-items: center;
        color: #8b949e; font-size: 11.5px; margin-bottom: 8px;
      }
      .auto { display: flex; align-items: center; gap: 6px; cursor: pointer; }

      button.ghost {
        appearance: none; border: 1px solid #30363d; border-radius: 6px;
        padding: 5px 10px; font: 500 11.5px/1 inherit; color: #8b949e;
        background: transparent; cursor: pointer;
      }
      button.ghost:hover { color: #e6edf3; border-color: #6e7681; }
      button.ghost:disabled { opacity: 0.4; cursor: default; }
      button.ghost.primary { color: #7ee787; border-color: rgba(63,185,80,0.4); }

      /* Packs */
      ul#packs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      ul#packs li {
        display: flex; align-items: center; gap: 10px;
        border: 1px solid #30363d; border-radius: 8px; padding: 9px 11px;
      }
      ul#packs li.active { border-color: #3fb950; }
      /* A track with a map and no notes: an invitation, not a thing that exists. */
      ul#packs li.empty { border-style: dashed; }
      .pack-main { flex: 1; min-width: 0; }
      .pack-id { overflow-wrap: anywhere; }
      .pack-sub { color: #6e7681; font-size: 11px; }
      li.empty-note { color: #6e7681; font-size: 11.5px; border: 0; padding: 0; }

      /* Overlays */
      ul#ov-profiles { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      li.ov-profile {
        border: 1px solid #30363d; border-radius: 8px; padding: 9px 11px;
      }
      li.ov-profile.active { border-color: #58a6ff; }
      .ov-row { display: flex; align-items: center; gap: 10px; }
      .ov-active-dot {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        border: 1px solid #6e7681; background: transparent; cursor: pointer; padding: 0;
        appearance: none;
      }
      li.ov-profile.active .ov-active-dot { background: #58a6ff; border-color: #58a6ff; }
      .ov-name {
        flex: 1; min-width: 0; overflow-wrap: anywhere;
        border-radius: 4px; padding: 1px 3px; margin: -1px -3px;
      }
      .ov-name[contenteditable="true"] {
        background: #161b22; outline: 1px solid #58a6ff; cursor: text;
      }
      .ov-actions { display: flex; gap: 6px; flex: none; }
      .ov-panels { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0 19px; }
      .ov-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
      .ov-group-name {
        width: 58px; flex: none; color: #6e7681; font-size: 10.5px;
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      .ov-panels label {
        display: flex; align-items: center; gap: 5px;
        color: #8b949e; font-size: 11.5px; cursor: pointer;
      }
      .ov-panels input { accent-color: #58a6ff; }

      .ov-hint { color: #6e7681; font-size: 11.5px; margin-top: 2px; }

      footer {
        border-top: 1px solid #21262d;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11.5px;
        color: #8b949e;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; flex: none; }
      .dot.waiting { background: #d29922; }
      .dot.running { background: #3fb950; }
      footer .where { margin-left: auto; color: #6e7681; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <nav class="sections">
        <button class="section-btn active" data-section="overlays" type="button" title="Overlays">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3" y="3" width="12" height="9" rx="1.5" />
            <rect x="9" y="12" width="12" height="9" rx="1.5" />
          </svg>
        </button>
        <button class="section-btn" data-section="packs" type="button" title="Track Coach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3v18" />
            <path d="M5 4h13l-3 4 3 4H5" />
          </svg>
        </button>
      </nav>
    </aside>

    <div class="shell">
      <nav class="top">
        <button class="power" id="power">Start</button>
        <span class="spacer"></span>
        <span class="pinned" id="pinned"></span>
      </nav>

      <main>
        <section class="view active" id="view-overlays">
          <div class="section-head">
            <span>Overlay profiles</span>
            <button class="ghost" id="ov-new" type="button">New profile</button>
          </div>
          <ul id="ov-profiles"></ul>
          <div class="ov-hint">
            Double-click a name to rename it. Edit shows that profile's overlays so
            you can drag them into place; Save locks them back down.
          </div>
        </section>

        <section class="view" id="view-packs">
          <div class="section-head">
            <span>Track Coach</span>
            <label class="auto"><input type="radio" name="pick" id="pick-auto" /> follow the sim</label>
            <button class="ghost" id="import-yt" type="button" title="Find a track guide and turn it into callouts (Ctrl+I)">Import from YouTube</button>
          </div>
          <ul id="packs"></ul>
        </section>
      </main>

      <footer>
        <span class="dot" id="dot"></span>
        <span id="phase">Stopped</span>
        <span id="detail"></span>
        <span class="where" id="where"></span>
      </footer>
    </div>

    <script type="module" src="./control.js"></script>
  </body>
</html>
