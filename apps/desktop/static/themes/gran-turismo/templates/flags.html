<!--
  A flag in Gran Turismo's language: a slate slab with the flag itself in a
  square box with a thin light edge, its name in white narrow capitals and
  what it means under it. Nothing at all when no flag is out.
-->
<div class="panel flags gt-flags">
  <div class="gt-flag" data-if="flag">
    <span class="gt-flag-box"><i class="flag-cloth {{ kind }}" data-class="waving: waving"></i></span>
    <span class="gt-flag-words"><b class="gt-label">{{ label }} flag</b><span>{{ hint }}</span></span>
  </div>
</div>
