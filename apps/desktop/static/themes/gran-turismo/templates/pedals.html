<!--
  Gran Turismo's speed cluster: a band of upright ticks on an even curve
  across the top, cut straight at both ends, over a dark body with straight
  sides that chamfer in to a flat foot. The speed in wide squared digits,
  km/h under it, a hairline, and the gear, wider and heavier,
  with a small label beside it where GT says AT, and GT's small red arrow at the redline. The gap to the reference
  sits in GT's red (or green) box above.

  Added to what GT shows, each switchable in the overlay's options: the input
  trace on the left; on the right the reference's speed (its gear takes GT's
  AT spot), the pedal bars and the wheel; the force feedback line under it all.
-->
<div class="panel pedals-panel gt-cluster">
  <div class="gt-cl-top">
    <div class="gt-delta n" data-part="delta" data-class="good: gaining; bad: losing">{{ deltaS | signed:3 | or:— }}</div>
  </div>
  <div class="gt-cl-box">
    <x-sweep class="gt-rev" shape="band" redline="0.82" mark data-part="revlights"></x-sweep>
    <div class="gt-cl-row">
      <div class="gt-cl-side left">
        <div class="gt-cl-graph" data-part="graph"><x-timeline></x-timeline></div>
      </div>
      <div class="gt-cl-speed">
        <span class="gt-digits gt-speed">{{ speedKph }}</span>
        <span class="gt-unit">km/h</span>
      </div>
      <div class="gt-cl-rule"></div>
      <div class="gt-cl-gear">
        <span class="gt-digits gt-gear">{{ gear }}</span>
        <span class="gt-unit gt-at" data-part="reference">ref {{ refGear | or:– }}</span>
      </div>
      <div class="gt-cl-side right">
        <div class="gt-cl-ref" data-part="reference">
          <span class="gt-unit">ref</span>
          <span class="gt-digits">{{ refSpeedKph | or:— }}</span>
        </div>
        <div class="gt-cl-pedals" data-part="pedals">
          <div class="gt-pbar brake"><i style="height:{{ brake.pct }}%"></i></div>
          <div class="gt-pbar throttle"><i style="height:{{ throttle.pct }}%"></i></div>
        </div>
        <div class="gt-cl-wheel" data-part="wheel"><div style="transform:rotate({{ wheelDeg }}deg)"><x-icon name="wheel" size="26"></x-icon></div></div>
      </div>
    </div>
    <div class="gt-cl-ffb" data-part="ffb"><span class="gt-unit">FFB</span><div class="gt-line"><i style="width:{{ ffbPct }}%"></i></div></div>
  </div>
</div>
