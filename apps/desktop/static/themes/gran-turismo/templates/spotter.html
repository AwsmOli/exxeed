<!--
  A car alongside, in Gran Turismo's language — one window per side (Blind
  Spot Left and Right both use this file; `side` says which). A slate slab
  with a warning sign and the side's name in white narrow capitals, lit red
  when the spotter calls a car there. No arrow: an arrow reads as "go
  there", which is the one thing not to do.
-->
<div class="panel spotter gt-spotter" data-class="is-empty: empty">
  <div class="gt-spot" data-class="on: on">
    <svg class="gt-warn" viewBox="0 0 48 42" aria-hidden="true">
      <path class="gt-warn-tri" d="M24 3 L45 39 H3 Z"></path>
      <path class="gt-warn-bang" d="M24 15v12M24 32v1.5"></path>
    </svg>
    <span class="gt-label">{{ side }}</span>
  </div>
  <div class="empty">{{ empty }}</div>
</div>
