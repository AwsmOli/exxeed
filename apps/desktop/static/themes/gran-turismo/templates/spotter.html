<!--
  A car alongside, in Gran Turismo's language: your car from above in the
  middle in red, as on GT's maps, and on each side a slate slab whose
  chevrons light red when the spotter calls a car there.
-->
<div class="panel spotter gt-spotter" data-class="is-empty: empty">
  <div class="gt-spot">
    <div class="gt-spot-side left" data-class="on: left">
      <svg viewBox="0 0 30 60" aria-hidden="true"><path d="M22 8L8 30l14 22M28 8L14 30l14 22"></path></svg>
    </div>
    <svg class="gt-spot-car" viewBox="0 0 40 84" aria-hidden="true">
      <path d="M12 4 Q20 0 28 4 L32 20 L32 70 Q32 80 20 81 Q8 80 8 70 L8 20 Z"></path>
    </svg>
    <div class="gt-spot-side right" data-class="on: right">
      <svg viewBox="0 0 30 60" aria-hidden="true"><path d="M8 8l14 22L8 52M2 8l14 22L2 52"></path></svg>
    </div>
  </div>
  <div class="empty">{{ empty }}</div>
</div>
