<!--
  Gran Turismo's tyre display: a drivetrain diagram in the middle — two
  axles, a small car, the front's turning arrows — between two brackets,
  and a tall tyre at each corner, red from the top as far as it is worn,
  the rest coloured by its temperature (blue cold, white right, red hot:
  the temp-* tokens). Beside each tyre its temperature, pressure and wear,
  which GT does not show; each can be switched off in the overlay's options.
-->
<div class="panel tyres gt-tyres" data-class="is-empty: empty">
  <div class="gt-ty">
    <span class="gt-brk left"></span>
    <div class="gt-ty-side left">
      <div class="gt-tyre">
        <div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ lf.tempC }}</span><span data-part="pressure">{{ lf.psi }} psi</span><span data-part="wear">{{ lf.wearPct }}%</span></div>
        <i class="gt-pill" style="background:{{ lf.colour }}"><b style="height:{{ lf.wornPct }}%"></b></i>
      </div>
      <div class="gt-tyre">
        <div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ lr.tempC }}</span><span data-part="pressure">{{ lr.psi }} psi</span><span data-part="wear">{{ lr.wearPct }}%</span></div>
        <i class="gt-pill" style="background:{{ lr.colour }}"><b style="height:{{ lr.wornPct }}%"></b></i>
      </div>
    </div>
    <svg class="gt-chassis" viewBox="0 0 40 70" aria-hidden="true">
      <path class="gt-ax" d="M4 14h32M4 56h32M20 14v42"></path>
      <path class="gt-turn" d="M7 7 Q20 1 33 7"></path>
      <path class="gt-turn-head" d="M5 9l2-4 3 3zM35 9l-2-4-3 3z"></path>
      <rect class="gt-body" x="13" y="24" width="14" height="22" rx="5"></rect>
      <path class="gt-ax-end" d="M2 10v8M38 10v8M2 52v8M38 52v8"></path>
    </svg>
    <div class="gt-ty-side right">
      <div class="gt-tyre">
        <i class="gt-pill" style="background:{{ rf.colour }}"><b style="height:{{ rf.wornPct }}%"></b></i>
        <div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ rf.tempC }}</span><span data-part="pressure">{{ rf.psi }} psi</span><span data-part="wear">{{ rf.wearPct }}%</span></div>
      </div>
      <div class="gt-tyre">
        <i class="gt-pill" style="background:{{ rr.colour }}"><b style="height:{{ rr.wornPct }}%"></b></i>
        <div class="gt-ty-vals"><span class="gt-digits" data-part="temps">{{ rr.tempC }}</span><span data-part="pressure">{{ rr.psi }} psi</span><span data-part="wear">{{ rr.wearPct }}%</span></div>
      </div>
    </div>
    <span class="gt-brk right"></span>
  </div>
  <div class="gt-caption gt-note" data-part="note">Last pit read</div>
  <div class="empty">{{ empty }}</div>
</div>
