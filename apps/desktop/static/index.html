<!doctype html>
<!--
  The overlay page — SPEC.md §7.

  Every overlay window loads this with `?overlay=1&panel=<id>` and shows that
  one panel. Opened on its own it stacks every panel on a dark page, which is
  the quickest way to look at them all at once while working on the styling.

  The panels build their own DOM (see ./panels/), so there is nothing here but
  the mount point.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- style-src 'self' for overlay.css; 'unsafe-inline' for the per-row
         colours the panels set (class colours, bar widths). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Exxeed</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- External, not inline: the page CSP is default-src 'self', which refuses
         inline script. Keeping it strict and moving the code out is the fix. -->
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
